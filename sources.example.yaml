# Скопируйте файл в sources.yaml и настройте его. Настоящий sources.yaml допустимо
# коммитить только с публичными URL; личные или платные URL храните в локальном файле.
rss:
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    limit: 5

# Для HTML-страниц нужны CSS-селекторы. Используется первый подходящий материал.
web:
  - name: Example site
    url: https://example.com/news
    item_selector: article
    title_selector: h2, h3
    link_selector: a
    description_selector: p
    image_selector: img
    limit: 5
